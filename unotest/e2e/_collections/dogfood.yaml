# The full dogfood suite: every DSL function is exercised by something in
# here (guarded by scripts/check-dsl-coverage.mjs).
#
# `sandbox/api` needs the fixture API — https://fixtures.unotest.com, or a
# local copy via `pnpm dogfood:fixtures` plus `--env local`.
# The viewer suite is separate (needs a running viewer): pnpm dogfood:viewer.
# The sandbox scenarios read a seeded sqlite fixture, so the suite prepares
# it itself — whoever starts the collection (schedule, CI, the viewer's Run
# button) gets the same environment. `--no-prepare` skips it for a run
# against an environment somebody else prepared.
prepare: "node unotest/fixtures/db/seed.mjs"
scenarios:
  - hub/smoke
  - hub/navigation
  - big-table/edit-dialog
  - big-table/counting-and-reading
  - big-table/refining-and-selection
  - iframes/deep-form
  - clicks/dblclick
  - clicks/popup-set-page
  - file-upload/attach
  - drag-drop/reorder
  - ws-live/cross-tab
  - catalog/traps
  - catalog/search-form
  - catalog/storage-survives-reload
  - catalog/delayed-navigation
  - dashboard/login
  - dashboard/users-crud
  - dashboard/users-sorting-pagination
  - dashboard/wizard
  - dashboard/settings
  - dashboard/checkout
  - misc/time-helpers
  - misc/evaluate
  - misc/generators
  - misc/random-nth-and-screenshot
  - negative/window-asserts
  - sandbox/db
  - sandbox/shell
  - sandbox/wait-for-file
  - sandbox/file-oracle
  - sandbox/api
  - sandbox/assert-judge
  - data-driven/pages-from-jsonl
  - data-driven/soft-steps-tagged
  - data-driven/annotations
  - data-driven/nested-helpers

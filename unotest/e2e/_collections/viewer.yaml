# Viewer UI suite. Not part of `dogfood`: it drives a viewer over the frozen
# fixture project rather than the playground. Nothing to set up — the
# scenarios navigate to VIEWER_URL and bring that viewer up themselves (see
# unotest/e2e/_helpers/viewer.js).
scenarios:
  - viewer/scenario-tree
  - viewer/overview
  - viewer/overview-expected-failure
  - viewer/overview-hover
  - viewer/overview-empty-filter
  - viewer/run-history
  - viewer/history-filter-by-test
  - viewer/run-from-ui
  # Last on purpose: it deliberately occupies the fixture viewer's run
  # slot, and a stand that is killed mid-scenario keeps it for a few more
  # seconds. Nothing behind it to delay.
  - viewer/run-queue
